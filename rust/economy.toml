# Ce qu'une monture de la **couleur poursuivie** pèse devant le score, en kamas.
#
# ## L'ordre lexicographique, et pourquoi il a cessé de tenir
#
# Ce poids valait cent millions, choisis exprès **au-dessus** de ce qu'une partie
# entière liquide : une couronne de plus l'emportait alors toujours sur une
# écurie plus riche. Ce n'était pas un taux de change, c'était un ordre
# lexicographique écrit en arithmétique.
#
# Il tenait tant que le score pesait assez pour départager à couronnes égales.
# Deux changements l'ont vidé : la prime de collection ramenée au dixième, et la
# profondeur de marché qui plafonne ce qu'un stock rapporte. Le terme de couronne,
# lui, est **plat** dès que `--project-count` est atteint.
#
# Mesuré sur la manche du 20/08, 1679 générations : champion à 987,25 M de
# départage, dont **2,9 % seulement** venaient du score. Gagner un dixième de
# couronne en moyenne pesait plus que gagner un tiers de toute l'économie. La
# recherche s'est arrêtée à **91 croisements** là où le champion embarqué en fait
# 1335, et elle a rendu 29,05 M contre 48,06 M — pire que la valeur myope.
#
# ## L'échelle d'aujourd'hui
#
# Cinq millions. Dix couronnes valent 50 M, soit à peu près **une partie** (30 à
# 60 M). Pour comparaison : une gen 10 se liste à 600 000, et dix d'une même
# couleur n'en rendent que 3,9 M sous la profondeur de marché. Le projet reste
# donc une préférence forte — huit fois le prix du marché — mais il doit encore
# gagner sa place, au lieu de rendre tout le reste indifférent.
#
# Absent, on retrouve les cent millions et l'ordre lexicographique.
poids_couronne = 5_000_000

