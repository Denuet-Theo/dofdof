# Les mutants que `cargo mutants` doit laisser tranquilles, et pourquoi.
#
# ## La commande, parce qu'elle n'était écrite nulle part
#
#   export DOFDOF_TREES="$PWD/../src/lib/dofus/breeding/trees.json"
#   export DOFDOF_FIXTURES="$PWD/../scripts/fixtures"
#   cargo mutants --file breeding-sim/src/ladder.rs --profile release -j 12
#
# Les deux variables : `CARGO_MANIFEST_DIR` est figé à la compilation, et un chemin
# qui remonte au-dessus de `rust/` sort de la copie que `cargo mutants` bâtit. Sans
# elles, le **baseline échoue** et la commande annonce « Found 404 mutants to test »
# puis s'arrête sans en jouer un seul. C'est arrivé jusqu'au 27/08 :
# `breeding-sim/tests/parity.rs` bâtissait son chemin à la main, donc la couverture
# de mutation de `ladder.rs` ne mesurait rien. Garde :
# `breeding-sim/tests/sandbox_paths.rs`.
#
# `--profile release` : les tests de mesure de `ladder.rs` jouent des parties
# entières. En debug, une passe demandait dix-sept heures ; en release, environ huit
# à `-j 12`. Le temps reste dominé par les mutants qui **ralentissent** la
# simulation sans la casser — 850 s de test pour 3 s de compilation, contre 44 s
# pour l'arbre sain — et ceux-là sont de vrais survivants, pas des délais.
#
# ## Ce que la mesure ne juge PAS, et c'est un trou
#
# `cargo mutants` ne joue que les tests du paquet muté. Le contrat de référence de
# la fournée — `breeding-neat/tests/ladder_policy_parity.rs`, celui sur lequel tout
# le raisonnement ci-dessous repose — vit dans l'autre paquet et **ne tourne pas**.
# Ni `--test-package breeding-sim,breeding-neat` ni `--test-workspace true` ne l'ont
# fait entrer : vérifié, `ladder_policy_parity` n'apparaît dans aucun journal de
# baseline.
#
# Conséquence à garder en tête en lisant `missed.txt` : les survivants sont mesurés
# contre les seuls tests de `breeding-sim`, donc leur nombre est une **borne
# supérieure**. Certains mourraient sous le contrat de fournée. Le résoudre demande
# soit de déplacer le contrat dans `breeding-sim`, soit de trouver comment faire
# tester les deux paquets — et pas de faire taire les survivants ici.
#
# ## À quoi sert ce fichier
#
# La garde de parité (`scripts/check-ladder-policy.mjs` d'un côté,
# `breeding-neat/tests/ladder_policy_parity.rs` de l'autre) se prononce sur
# 98 fournées. Un mutant qui y survit désigne une ligne que ces fournées
# n'exercent pas — donc un endroit où les deux ports peuvent divorcer sans que
# rien ne le dise. C'est un signal, et il ne vaut que s'il n'est pas noyé.
#
# D'où ce fichier : ce qui est ici est **volontairement** hors référence, avec
# la raison écrite. Ce qui n'y est pas et survit est un vrai trou.
#
# Ne pas s'en servir pour faire taire un mutant gênant. La bonne réponse à un
# survivant est presque toujours un cas de référence en plus — voir
# `parity.rs`, où l'insolvabilité, `clone_top` éteint et le départage à sexe
# égal ont été ajoutés exactement pour ça.

exclude_re = [
    # `clone_same_lineage` n'est **jamais appelée** : `clone_across_lineages`
    # vaut `true` par défaut des deux côtés, et le levier existe « pour la
    # mesure » — il sert à dire ce que le relâchement vers
    # `clone_by_generation` rapporte. Aucun portage TypeScript ne l'accompagne,
    # et il ne doit pas en avoir un : l'app ne l'exécute pas, et ce dépôt a
    # déjà payé le prix des gardes qui protègent du code que personne ne lance
    # (voir AGENTS.md, « ce qui n'est plus là »).
    #
    # Cinq mutants y survivaient à chaque passage. Les exclure rend les
    # survivants restants lisibles.
    "clone_same_lineage",
    # `LadderPolicy::summit` et `summit_partner` composent la boucle du forum —
    # accumuler des gen 10 pour les vendre — et `summit` **sort au premier test**
    # si le régime n'est pas `Summit::Duplicate`. Or le défaut est
    # `Summit::Target` des deux côtés depuis le 27/08, et rien n'allume
    # `Duplicate` : ni l'app, ni le dumper de référence, ni `bench`.
    #
    # Aucun cas de parité ne peut donc les atteindre, et en ajouter un
    # n'aiderait pas : il n'y a **rien à comparer**. Le TypeScript ne porte pas
    # cette composition, et ne doit pas la porter — la boucle est mesurée à
    # **−1,43 M** sur le parc de l'éleveur, dont le seul sommet porteur de gen 9
    # est stérile et sans jumelle à cloner.
    #
    # Ce sont les deux fonctions, et pas le mot « summit » : `Summit::Target`
    # agit par l'admissibilité, qui est portée et dont les mutants doivent
    # continuer à mourir.
    #
    # Quatorze mutants y survivaient à chaque passage, dont douze dans
    # `summit_partner` seule.
    "LadderPolicy::summit_partner",
    "LadderPolicy::summit\\b",
]
