[workspace]
resolver = "3"
members = ["breeding-sim", "breeding-neat"]

[workspace.package]
edition = "2024"
version = "0.1.0"

# Le simulateur passe son temps dans `mating_outcomes` et l'encodage : on compile
# les dépendances en optimisé même en debug, sinon `cargo test` sur les 5 000
# paires de parité devient pénible.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
